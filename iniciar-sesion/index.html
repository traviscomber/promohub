<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — PromoHub</title>
  <meta name="description" content="Inicia sesión en PromoHub para guardar tus promociones favoritas y recibir alertas de descuentos en Chile.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.promohub.cl/iniciar-sesion">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CL">
  <meta property="og:site_name" content="PromoHub">
  <meta property="og:title" content="Iniciar sesión — PromoHub">
  <meta property="og:url" content="https://www.promohub.cl/iniciar-sesion">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>

  <header class="encabezado">
    <div class="contenedor">
      <a class="logo" href="/">
        <span class="logo-icono" aria-hidden="true">%</span>
        PromoHub
      </a>
      <button class="boton-menu" aria-label="Abrir menú" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="nav-principal" aria-label="Navegación principal">
        <ul>
          <li><a href="/">Inicio</a></li>
          <li><a href="/promociones">Promociones</a></li>
          <li><a href="/tiendas">Tiendas</a></li>
          <li><a class="nav-cta activo" href="/iniciar-sesion">Iniciar sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="pagina-auth">
    <div class="tarjeta-auth">
      <h1>Bienvenido de nuevo</h1>
      <p class="sub">Inicia sesión para guardar tus promociones favoritas.</p>
      <form data-auth novalidate>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@correo.cl" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="boton boton-primario boton-ancho" type="submit">Iniciar sesión</button>
      </form>
      <p class="mensaje-form" role="status" aria-live="polite"></p>
      <p class="auth-nota">¿No tienes cuenta? <a href="/iniciar-sesion">Crea una gratis</a></p>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <div class="pie-inferior" style="border-top:0; padding-top:0;">
        <span>© <span data-anio>2025</span> PromoHub — Chile</span>
        <span><a href="/">Volver al inicio</a></span>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
